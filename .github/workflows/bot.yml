name: ISP WhatsApp Bot Worker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (scan / force_scan / send)'
        required: true
        default: 'scan'
      payload:
        description: 'JSON payload for sending messages'
        required: false
        default: '{}'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-baileys-fast-v1

      - name: Install Node Dependencies (Only if not cached)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install @whiskeysockets/baileys qrcode-terminal pino --no-audit --no-fund

      - name: Restore WhatsApp Session from Secret
        if: env.WA_SESSION_B64 != ''
        env:
          WA_SESSION_B64: ${{ secrets.WA_SESSION_B64 }}
        run: |
          echo "$WA_SESSION_B64" | base64 -d | tar -xzf -

      - name: Start WhatsApp Bridge & Run Task
        env:
          ACTION_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          node server.js &
          BRIDGE_PID=$!
          python3 gh_worker.py "${{ github.event.inputs.action || 'scan' }}"
          kill $BRIDGE_PID || true

      - name: Save Updated State & Cache to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch state.json smart_cache.json
          git add state.json smart_cache.json
          git diff --quiet && git diff --staged --quiet || (git pull --rebase && git commit -m "Auto-update state and cache [skip ci]" && git push)
